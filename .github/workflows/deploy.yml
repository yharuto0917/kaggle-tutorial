name: Deploy

# main へのマージ（または手動実行）で Cloudflare（OpenNext）へデプロイする。
# 必要な GitHub Secrets:
#   - CLOUDFLARE_API_TOKEN  : D1・Workers のデプロイ権限を持つ API トークン
#   - CLOUDFLARE_ACCOUNT_ID : Cloudflare アカウント ID
# 事前準備（手動・一度きり）:
#   - `wrangler d1 create kaggle_tutorial_db` で D1 を作成し、出力 database_id を
#     wrangler.jsonc の d1_databases[0].database_id に設定（現状はプレースホルダ）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一ブランチのデプロイは直列化（実行中はキャンセルしない）。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 本番 D1 へマイグレーション適用（drizzle 生成 SQL を wrangler で適用。push は使わない）。
      # 未適用が無ければ no-op。database_id 未設定だと失敗するため事前準備が前提。
      - name: Apply D1 migrations (remote)
        run: pnpm db:migrate:remote

      # Next ビルド＋postbuild で Pagefind 索引を public/pagefind/ に生成する。
      # （opennextjs-cloudflare build は内部で next build を呼ぶが postbuild は走らないため、
      #   索引生成のためにここで pnpm build を実行する。）
      - name: Build (Next + Pagefind index)
        run: pnpm build

      # OpenNext でビルドし Cloudflare へデプロイ（public/pagefind/ を含む）。
      - name: Deploy (OpenNext → Cloudflare)
        run: pnpm deploy
